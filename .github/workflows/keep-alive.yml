name: Keep Render App Awake

on:
  schedule:
    # Runs every 14 minutes (Render Free tier sleeps after 15 minutes)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping:
    name: Self-Ping Keep-Alive
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Ping to Render
        run: |
          TARGET_URL="${{ secrets.RENDER_APP_URL || vars.RENDER_APP_URL }}"
          if [ -z "$TARGET_URL" ]; then
            echo "No RENDER_APP_URL specified yet. Please set RENDER_APP_URL in GitHub Repo Settings -> Secrets/Variables."
            exit 0
          fi
          echo "Pinging: $TARGET_URL/health"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL/health" || echo "failed")
          echo "Response Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Successfully reset Render 15-minute idle timer!"
          fi
