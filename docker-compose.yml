version: '3.8'

# ==============================================================================
# SMART SCHOOL MANAGEMENT SYSTEM - LOCAL DOCKER COMPOSE STACK
# Infosof Technologies 2026
#
# Runs the full production Docker image alongside MySQL 8 for local testing.
# Start with: docker compose up -d --build
# App URL:    http://localhost:10000
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_school_app
    restart: unless-stopped
    ports:
      - "10000:10000"
    environment:
      - PORT=10000
      - CI_ENV=development
      - APP_URL=http://localhost:10000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=smart_school
      - DB_USERNAME=smart_user
      - DB_PASSWORD=smart_password_2026
      - DB_SSL=false
      - AUTO_MIGRATE=true
      - MIGRATION_SECRET=smart_school_init_2026
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: smart_school_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password_2026
      MYSQL_DATABASE: smart_school
      MYSQL_USER: smart_user
      MYSQL_PASSWORD: smart_password_2026
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "smart_user", "-psmart_password_2026"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db_data:
